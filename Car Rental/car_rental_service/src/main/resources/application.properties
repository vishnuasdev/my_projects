server.port=8080
server.servlet.context-path=/

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/car_rental_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.seed-default-users=${SEED_DEFAULT_USERS:false}
app.seed-default-password=${SEED_DEFAULT_PASSWORD:}